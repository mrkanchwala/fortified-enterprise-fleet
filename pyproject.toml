[project]
name = "fleet-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.6.2",
    "google-cloud-firestore>=2.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "uvicorn>=0.52.1",
]

[project.scripts]
fleet-hackathon = "fleet_hackathon:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
